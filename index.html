<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NULL</title>
    <link rel="icon" id="null-favicon" href="/favicons/default.svg" type="image/svg+xml" />
    <meta name="description" content="NULL — a clean, fast hub for games and apps." />
    <script>
      // GitHub Pages SPA redirect trick: 404.html stashes the intended
      // path in sessionStorage and bounces to /. We restore it here
      // before the router boots, so deep links and refreshes work on
      // static GitHub Pages hosting.
      (function () {
        var redirect = sessionStorage.getItem("null_redirect_path");
        if (redirect) {
          sessionStorage.removeItem("null_redirect_path");
          if (redirect !== location.pathname) {
            history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
