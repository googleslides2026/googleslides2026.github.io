<!doctype html><html lang="en"><head><meta charset="UTF-8">
<title>NULL Mini</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root{--bg:#0a0a0b;--surface:#17171a;--surface-hover:#1e1e22;--border:#27272b;--text:#f2f2f3;--text-dim:#9a9aa2;--accent:#38bdf8;--radius:8px;--danger:#ef4444;}
    [data-theme="light"]{--bg:#f5f5f7;--surface:#fff;--surface-hover:#ececef;--border:#e0e0e3;--text:#17171a;--text-dim:#57575f;}
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
    a{color:inherit;}
    header{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);z-index:10;flex-wrap:wrap;}
    header b{font-size:16px;margin-right:8px;cursor:pointer;}
    nav{display:flex;gap:4px;flex-wrap:wrap;}
    nav a{padding:6px 10px;border-radius:var(--radius);font-size:13px;cursor:pointer;color:var(--text-dim);}
    nav a:hover, nav a.active{background:var(--surface-hover);color:var(--text);}
    input[type=text], select{padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);}
    input[type=text]{flex:1;max-width:320px;}
    main{padding:16px;max-width:1100px;margin:0 auto;}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;}
    
    .thumb{aspect-ratio:1/1;width:100%;background:#101012;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .thumb img{width:100%;height:100%;object-fit:cover;}
    .body{padding:8px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
    .title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .label{font-size:11px;color:var(--text-dim);margin-top:2px;}
    .star{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:16px;flex-shrink:0;}
    .star.active{color:var(--accent);}
    .empty{text-align:center;color:var(--text-dim);padding:48px 16px;grid-column:1/-1;}
    button.btn{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;}
    button.btn:hover{background:var(--surface-hover);}
    .btn-danger{border-color:var(--danger);color:var(--danger);}
    .pagination{display:flex;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap;}
    #player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100;}
    #player.open{display:flex;}
    #player .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);}
    #player iframe{flex:1;border:none;width:100%;}
    footer{text-align:center;color:var(--text-dim);font-size:11px;padding:20px;}
    .settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap;}
    .settings-row:first-child{border-top:none;}
    .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
    .schedule{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
    .schedule .card2{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;}
    .schedule .lbl{font-size:11px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;}
    .schedule .val{font-size:18px;font-weight:700;}
    @media (max-width:700px){ .schedule{grid-template-columns:1fr;} }
  </style>
</head><body data-theme="dark">
<header>
  <b data-nav="home">NULL Mini</b>
  <nav><a data-nav="home">Home</a><a data-nav="games">Games</a><a data-nav="apps">Apps</a></nav>
  <input type="text" id="q" placeholder="Search games…" style="display:none">
</header>
<main id="main"></main>
<footer>NULL Mini — single-file build. Minimal size for low-storage devices.</footer>
<div id="player">
  <div class="bar">
    <button class="btn" id="back">← Back</button>
    <b id="ptitle" style="flex:1"></b>
    <button class="btn" id="reload">Reload</button>
    <button class="btn" id="fullscreen">Fullscreen</button>
  </div>
  <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals"></iframe>
</div>
<script>
(function(){
  "use strict";
  var CATALOG = {"games":[{"id":"hollow-knight","kind":"game","title":"Hollow Knight","route":"games/hollow-knight/","htmlFile":"hollow-knight.html","htmlPath":"../games/hollow-knight/hollow-knight.html","thumbnail":"../games/hollow-knight/hollow-knight.svg","labels":["Platformer","Metroidvania"]}],"apps":[{"id":"example-app","kind":"app","title":"Example App","route":"apps/example-app/","htmlFile":"example-app.html","htmlPath":"../apps/example-app/example-app.html","thumbnail":"../apps/example-app/example-app.svg","labels":["Utility"]}]};
  var VARIANT = "mini";
  var STAGGER = false;

  
    var SCHEDULE=[{name:"Period 1",start:"08:00",end:"08:50"},{name:"Passing",start:"08:50",end:"08:55",passing:true},{name:"Period 2",start:"08:55",end:"09:45"},{name:"Passing",start:"09:45",end:"09:50",passing:true},{name:"Period 3",start:"09:50",end:"10:40"},{name:"Passing",start:"10:40",end:"10:45",passing:true},{name:"Period 4",start:"10:45",end:"11:35"},{name:"Lunch",start:"11:35",end:"12:05"},{name:"Period 5",start:"12:05",end:"12:55"},{name:"Passing",start:"12:55",end:"13:00",passing:true},{name:"Period 6",start:"13:00",end:"13:50"},{name:"Passing",start:"13:50",end:"13:55",passing:true},{name:"Period 7",start:"13:55",end:"14:45"},{name:"Passing",start:"14:45",end:"14:50",passing:true},{name:"Period 8",start:"14:50",end:"15:40"}];
    function toMin(t){var p=t.split(":");return +p[0]*60+ +p[1];}
    function scheduleState(){
      var now=new Date(); var nm=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
      if(!SCHEDULE.length) return {state:"after"};
      if(nm<toMin(SCHEDULE[0].start)) return {state:"before", secs:Math.round((toMin(SCHEDULE[0].start)-nm)*60)};
      if(nm>=toMin(SCHEDULE[SCHEDULE.length-1].end)) return {state:"after"};
      for(var i=0;i<SCHEDULE.length;i++){
        var e=SCHEDULE[i], s=toMin(e.start), en=toMin(e.end);
        if(nm>=s&&nm<en){
          var next=null;
          for(var j=i+1;j<SCHEDULE.length;j++){ if(!SCHEDULE[j].passing){ next=SCHEDULE[j]; break; } }
          return {state:"in", cur:e, secs:Math.round((en-nm)*60), next:next};
        }
      }
      return {state:"after"};
    }
    function fmtMS(s){ var m=Math.floor(s/60), sec=s%60; return m+":"+String(sec).padStart(2,"0"); }
    function fmtHMS(s){ var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return h+"h "+String(m).padStart(2,"0")+"m "+String(sec).padStart(2,"0")+"s"; }
  

  function loadJson(key, fallback){ try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch(e){ return fallback; } }
  function saveJson(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  var STATE_KEY = "nullrelease_" + VARIANT;
  var state = loadJson(STATE_KEY, { theme: "dark", accent: 200, favorites: [], plays: {} });
  function persist(){ saveJson(STATE_KEY, state); }

  document.body.setAttribute("data-theme", state.theme);

  var main = document.getElementById("main");
  var searchInput = document.getElementById("q");
  var pageSize = 30;
  var currentPage = 1;

  function h(tag, attrs, children){
    var el = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "class") el.className = attrs[k];
      else if (k === "html") el.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){ if (c) el.appendChild(c); });
    return el;
  }

  function card(item){
    var thumbDiv = h("div", { class: "thumb" });
    var el = h("card" === "x" ? "div" : "div", { class: "card" }, [thumbDiv]);
    var body = h("div", { class: "body" });
    var titleWrap = h("div", {}, [
      h("div", { class: "title", html: item.title }),
      h("div", { class: "label", html: (item.labels || []).join(", ") })
    ]);
    var isFav = state.favorites.indexOf(item.id) !== -1;
    var star = h("button", { class: "star" + (isFav ? " active" : ""), html: isFav ? "★" : "☆" });
    star.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = state.favorites.indexOf(item.id);
      if (idx === -1) state.favorites.push(item.id); else state.favorites.splice(idx, 1);
      persist();
      star.classList.toggle("active");
      star.textContent = state.favorites.indexOf(item.id) !== -1 ? "★" : "☆";
    });
    body.appendChild(titleWrap);
    body.appendChild(star);
    el.appendChild(body);
    el.addEventListener("click", function(){ openItem(item); });

    var img = document.createElement("img");
    img.alt = "";
    img.loading = "lazy";
    if (item.thumbnail) {
      if (STAGGER) {
        el._pendingSrc = item.thumbnail;
        el._imgEl = img;
        thumbDiv.appendChild(img);
      } else {
        img.src = item.thumbnail;
        thumbDiv.appendChild(img);
      }
    }
    return el;
  }

  // Lite build: reveal thumbnails a handful at a time with a short delay
  // between batches, so older/weaker devices never have to decode dozens
  // of images in a single frame.
  function staggerReveal(container){
    if (!STAGGER) return;
    var pending = Array.prototype.filter.call(container.children, function(c){ return c._pendingSrc; });
    var batchSize = 4, delay = 120, i = 0;
    function nextBatch(){
      var batch = pending.slice(i, i + batchSize);
      batch.forEach(function(el){ el._imgEl.src = el._pendingSrc; });
      i += batchSize;
      if (i < pending.length) setTimeout(nextBatch, delay);
    }
    nextBatch();
  }

  function openItem(item){
    var player = document.getElementById("player");
    var frame = document.getElementById("frame");
    document.getElementById("ptitle").textContent = item.title;
    frame.src = item.htmlPath;
    player.classList.add("open");
    if (item.kind === "game") {
      state.plays[item.id] = (state.plays[item.id] || 0) + 1;
      persist();
    }
  }
  document.getElementById("back").addEventListener("click", function(){
    document.getElementById("player").classList.remove("open");
    document.getElementById("frame").src = "";
  });
  document.getElementById("reload").addEventListener("click", function(){
    var f = document.getElementById("frame");
    f.src = f.src;
  });
  document.getElementById("fullscreen").addEventListener("click", function(){
    var f = document.getElementById("frame");
    if (f.requestFullscreen) f.requestFullscreen();
  });

  function renderGrid(list, opts){
    opts = opts || {};
    var grid = h("div", { class: "grid" });
    if (!list.length) {
      grid.appendChild(h("div", { class: "empty", html: "Nothing here yet." }));
      return grid;
    }
    var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
    currentPage = Math.min(currentPage, totalPages);
    var start = (currentPage - 1) * pageSize;
    list.slice(start, start + pageSize).forEach(function(item){ grid.appendChild(card(item)); });
    var wrap = h("div", {}, [grid]);
    if (totalPages > 1) {
      var pag = h("div", { class: "pagination" });
      for (var p = 1; p <= totalPages; p++) {
        (function(pn){
          var btn = h("button", { class: "btn", html: String(pn) });
          if (pn === currentPage) btn.style.background = "var(--accent)";
          btn.addEventListener("click", function(){ currentPage = pn; render(); window.scrollTo({top:0}); });
          pag.appendChild(btn);
        })(p);
      }
      wrap.appendChild(pag);
    }
    setTimeout(function(){ staggerReveal(grid); }, 0);
    return wrap;
  }

  function renderHome(){
    main.innerHTML = "";
    if (false) main.appendChild(renderSchedule());
    main.appendChild(h("h3", { html: "Games" }));
    main.appendChild(renderGrid(CATALOG.games.slice(0, 12)));
  }

  function renderSchedule(){
    var box = h("div", { class: "schedule" });
    function draw(){
      var s = scheduleState();
      box.innerHTML = "";
      if (s.state === "before") {
        box.style.gridTemplateColumns = "1fr";
        box.appendChild(h("div", { class: "card2" }, [h("div",{class:"lbl",html:"Before School"}), h("div",{class:"val",html:fmtHMS(s.secs)})]));
        return;
      }
      if (s.state === "after") {
        box.style.gridTemplateColumns = "1fr";
        box.appendChild(h("div", { class: "card2" }, [h("div",{class:"lbl",html:"After School"}), h("div",{class:"val",html:"See you tomorrow."})]));
        return;
      }
      box.style.gridTemplateColumns = "repeat(3,1fr)";
      box.appendChild(h("div", { class: "card2" }, [h("div",{class:"lbl",html:"Current Period"}), h("div",{class:"val",html:s.cur.name})]));
      box.appendChild(h("div", { class: "card2" }, [h("div",{class:"lbl",html:"Time Left"}), h("div",{class:"val",html:fmtMS(s.secs)})]));
      box.appendChild(h("div", { class: "card2" }, [h("div",{class:"lbl",html:"Next Period"}), h("div",{class:"val",html:s.next?s.next.name:"—"})]));
    }
    draw();
    setInterval(draw, 1000);
    return box;
  }

  function renderGames(){
    main.innerHTML = "";
    searchInput.style.display = "";
    var toolbar = h("div", { class: "toolbar" });
    var sortSelect = h("select", {}, []);
    ["popular","newest","az","za"].forEach(function(v){
      var labels = {popular:"Popular",newest:"Newest",az:"A–Z",za:"Z–A"};
      sortSelect.appendChild(h("option", { value: v, html: labels[v] }));
    });
    toolbar.appendChild(sortSelect);
    main.appendChild(toolbar);
    var gridHolder = h("div");
    main.appendChild(gridHolder);

    function draw(){
      var q = searchInput.value.trim().toLowerCase();
      var list = CATALOG.games.filter(function(g){ return !q || g.title.toLowerCase().indexOf(q) !== -1; });
      var mode = sortSelect.value;
      if (mode === "az") list = list.slice().sort(function(a,b){ return a.title.localeCompare(b.title); });
      else if (mode === "za") list = list.slice().sort(function(a,b){ return b.title.localeCompare(a.title); });
      else if (mode === "popular") list = list.slice().sort(function(a,b){ return (state.plays[b.id]||0) - (state.plays[a.id]||0); });
      currentPage = 1;
      gridHolder.innerHTML = "";
      gridHolder.appendChild(renderGrid(list));
    }
    searchInput.addEventListener("input", draw);
    sortSelect.addEventListener("change", draw);
    draw();
  }

  function renderApps(){
    main.innerHTML = "";
    searchInput.style.display = "";
    var gridHolder = h("div");
    main.appendChild(gridHolder);
    function draw(){
      var q = searchInput.value.trim().toLowerCase();
      var list = CATALOG.apps.filter(function(a){ return !q || a.title.toLowerCase().indexOf(q) !== -1; });
      gridHolder.innerHTML = "";
      gridHolder.appendChild(renderGrid(list));
    }
    searchInput.addEventListener("input", draw);
    draw();
  }

  

  function render(){
    var route = location.hash.replace("#", "") || "home";
    Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(a){
      a.classList.toggle("active", a.getAttribute("data-nav") === route);
    });
    if (route === "games") renderGames();
    else if (route === "apps") renderApps();
    
    else renderHome();
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(a){
    a.addEventListener("click", function(){ location.hash = a.getAttribute("data-nav"); });
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body></html>
